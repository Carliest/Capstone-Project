services:
  - type: web
    name: capstone-api
    runtime: node
    rootDir: capstone-app/apps/api
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: capstone-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: capstone-redis
          property: connectionString

  - type: keyvalue
    name: capstone-redis
    plan: free

databases:
  - name: capstone-postgres
    plan: free
